name: Build Quarkus Native Image (Linux & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - example/paza-auto

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: quarkus-native-linux
            runner_glob: "*-runner"
          - os: windows-latest
            artifact_name: quarkus-native-windows
            runner_glob: "*-runner.exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 21
          components: native-image
          cache: maven

      - name: Verify GraalVM
        run: |
          java -version
          native-image --version
          mvn -version

      - name: Build Quarkus Native Image
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
        run: mvn clean package -Pnative -DskipTests

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.runner_glob }}
