quarkus.quinoa.package-manager-install.node-version=24.11.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=quinoa

quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist/spa
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.dev-server.enabled=true

# Security Configuration
quarkus.security.users.embedded.enabled=false

# JWT Configuration
# Signing key (for generating tokens)
smallrye.jwt.sign.key.location=privateKey-pkcs8.pem
# Verification key (for validating tokens)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://quarkus-quasar.example.com
jwt.issuer=https://quarkus-quasar.example.com
jwt.expiration.hours=24

%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.issuer=https://quarkus-quasar.example.com
%test.smallrye.jwt.sign.key.location=privateKey-pkcs8.pem

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8080,http://localhost:9000
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# OpenAPI/Swagger Configuration
quarkus.smallrye-openapi.info-title=Quarkus Quasar API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for Quarkus Quasar Application
quarkus.smallrye-openapi.servers=http://localhost:8080
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Database Configuration (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:yourpassword}

# For production, set DB_URL env var to configure the JDBC URL.
# Dev mode uses DevServices by default; set DB_URL to use a persistent database.
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/quarkusdb}

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.format_sql=true

# Flyway Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Repository Configuration
# Use "jpa" for database (default) or "memory" for in-memory
app.repository.type=jpa

app.security.salt=1234567890
app.security.reset-token.expiration-minutes=15
# RBAC Configuration
app.rbac.roles.admin=READ,CREATE,UPDATE,DELETE
app.rbac.roles.user=READ
app.rbac.roles.manager=READ,CREATE,UPDATE

app.security.salt=1234567890

# OpenTelemetry Configuration
quarkus.otel.enabled=true
quarkus.otel.sdk.disabled=false
# Disable the OTLP exporter to avoid connection errors to non-existent endpoint
quarkus.otel.exporter.otlp.enabled=false
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.resource.attributes=service.name=qoperasi
# Capture HTTP headers in traces
quarkus.otel.instrument.http.capture-headers.server.request=Authorization,Content-Type

# Micrometer Configuration
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=false
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.micrometer.binder.http-client.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# Logging
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b %D

# Log Format (include trace and span IDs in console logs)
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (traceId=%X{traceId}, spanId=%X{spanId}) %s%e%n
quarkus.otel.log.injection=true
