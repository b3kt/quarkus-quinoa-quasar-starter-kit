quarkus.quinoa.enabled=false

%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine

%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.generation=validate

%test.smallrye.jwt.sign.key.location=privateKey-pkcs8.pem
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.issuer=https://quarkus-quasar.example.com
%test.jwt.issuer=https://quarkus-quasar.example.com

%test.app.repository.type=jpa
%test.app.security.reset-token.expiration-minutes=15
